<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        p {
            font-size: 1.2em;
            line-height: 1.5;
        }

        footer {
            margin-top: 25px;
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Bienvenido!</h1>
        <p>
            Gracias por visitar esta página.<br>
            Este es el inicio de tu sitio web.
        </p>
        <footer>
            © 2026 - Tu Proyecto
        </footer>
    </div>
</body>
</html>
